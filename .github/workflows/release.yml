name: Build documentation and release CosmosUtils

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'The version of this build'
                required: true
                type: string
                
env:
    DOTNET_VERSION: '10.0.x'
    CONFIGURATION: 'Release'
    MAIN_PROJECT_NAME: 'TrueDotBin.CosmosUtils'
    NUGET_PROFILE: 'Demiomad'
                
jobs:
    build:
        runs-on: ubuntu-latest
                    
        permissions:
            id-token: write
            contents: write
                    
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
                    
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: ${{ env.DOTNET_VERSION }}
                        
            - name: Restore
              run: dotnet restore ./${{ env.MAIN_PROJECT_NAME }}/${{ env.MAIN_PROJECT_NAME }}.csproj
                        
            - name: Build
              run: >
                dotnet build
                ./${{ env.MAIN_PROJECT_NAME }}/${{ env.MAIN_PROJECT_NAME }}.csproj
                -c ${{ env.CONFIGURATION }}
                -p:Version=${{ inputs.version }}

            - name: NuGet login
              uses: NuGet/login@v1
              id: login
              with:
                user: ${{ env.NUGET_PROFILE }}

            - name: Push to NuGet
              run: >
                dotnet nuget push
                ./${{ env.MAIN_PROJECT_NAME }}/bin/${{ env.CONFIGURATION }}/*.nupkg
                --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
                --source https://api.nuget.org/v3/index.json
                --skip-duplicate

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                draft: true
                tag_name: v${{ inputs.version }}
                name: CosmosUtils v${{ inputs.version }}
                body: |
                    ## Installation
                    - **NuGet (recommended):** `dotnet add package TrueDotBin.CosmosUtils --version ${{ inputs.version }}`
                    - **Manual:** download `CosmosUtils-${{ inputs.version }}.zip` and reference the DLLs directly.
                files: ${{ env.MAIN_PROJECT_NAME }}/bin/${{ env.CONFIGURATION }}/*.nupkg
                fail_on_unmatched_files: true
                prerelease: ${{ contains(inputs.version, 'alpha') || contains(inputs.version, 'beta') }}

    docs:
        needs: build
        runs-on: ubuntu-latest

        permissions:
            contents: read
            pages: write
            id-token: write

        steps:
            - name: Checout repo
              uses: actions/checkout@v4
            
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Install DocFX
              run: dotnet tool install -g docfx

            - name: Build docs
              run: docfx docfx.json

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                path: _site
                
            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v4